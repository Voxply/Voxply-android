name: Android build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Fetch voxply-voice crate (Voxply-desktop)
        uses: actions/checkout@v4
        with:
          repository: Voxply/Voxply-desktop
          sparse-checkout: |
            voice
          sparse-checkout-cone-mode: false
          path: _voxply_desktop

      - name: Place voice crate at workspace-relative path
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          mkdir -p "$parent/desktop"
          cp -r "$GITHUB_WORKSPACE/_voxply_desktop/voice" "$parent/desktop/voice"
          cat > "$parent/desktop/Cargo.toml" <<'WORKSPACE_EOF'
          [workspace]
          resolver = "2"
          members = ["voice"]

          [workspace.dependencies]
          tokio = { version = "1", features = ["full"] }
          tracing = "0.1"
          tracing-subscriber = "0.3"
          anyhow = "1"
          WORKSPACE_EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            build-tools;36.1.0
            platforms;android-36
            ndk;27.0.12077973

      - name: Set up Rust (stable, Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/src-tauri

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            android/package-lock.json
            voxply-desktop/package-lock.json
            voxply-web/package-lock.json

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/src-tauri/gen/android/gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm dependencies (android)
        working-directory: android
        run: npm install

      - name: Install npm dependencies (voxply-desktop)
        working-directory: voxply-desktop
        run: npm install --legacy-peer-deps

      - name: Install npm dependencies (voxply-web)
        working-directory: voxply-web
        run: npm install

      - name: TypeScript check
        working-directory: android
        run: npx tsc --noEmit

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/voxply.keystore

      - name: Generate Android project
        working-directory: android
        run: npx tauri android init

      - name: Build APK
        working-directory: android
        run: >-
          npx tauri android build
          --target aarch64
          --target armv7
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/voxply.keystore' || '' }}
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: voxply
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Save Gradle cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/src-tauri/gen/android/gradle*') }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
